name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name for a test build (e.g. 1.16.0). Defaults to 0.0.<run number>.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.versionName }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          elif [[ -n "${DISPATCH_VERSION}" ]]; then
            name="${DISPATCH_VERSION}"
          else
            name="0.0.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode must increase monotonically for update clients (e.g. Obtainium).
          # Offset keeps CI builds above the local default (15) in app/build.gradle.
          code=$((100000 + GITHUB_RUN_NUMBER))
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Write signing config
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -z "${SIGNING_KEYSTORE_BASE64}" ]]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not set. See docs/self-hosting.md."
            exit 1
          fi
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
          cat > keystore.properties <<EOF
          storeFile=${RUNNER_TEMP}/release.jks
          storePassword=${SIGNING_STORE_PASSWORD}
          keyAlias=${SIGNING_KEY_ALIAS}
          keyPassword=${SIGNING_KEY_PASSWORD}
          EOF

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Prepare artifacts
        id: artifacts
        run: |
          mkdir -p out
          apk="out/AnkiconnectAndroid-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${apk}"
          sha256sum "${apk}" > "${apk}.sha256"
          ls -l out

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: AnkiconnectAndroid-${{ steps.version.outputs.name }}
          path: out/*
          if-no-files-found: error
