plugins {
    id 'com.android.application'
}

// Release signing is configured through keystore.properties in the repository root.
// The file is intentionally gitignored; see keystore.properties.example and
// docs/self-hosting.md. Without it, `assembleRelease` produces an unsigned APK.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseSigning = keystorePropertiesFile.exists()

// Continuous integration overrides these with -PversionCode=... / -PversionName=...
def versionCodeOverride = project.findProperty("versionCode")
def versionNameOverride = project.findProperty("versionName")

android {
    compileSdk 33

    defaultConfig {
        // Distinct from the upstream com.kamwithk.ankiconnectandroid so this fork
        // can be installed side by side and updated independently.
        applicationId "com.lolle2000la.ankiconnectandroid"
        minSdk 26
        targetSdk 33
        versionCode (versionCodeOverride != null ? versionCodeOverride.toInteger() : 15)
        versionName (versionNameOverride != null ? versionNameOverride : "1.15")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_9
        targetCompatibility JavaVersion.VERSION_1_9
    }
    namespace 'com.kamwithk.ankiconnectandroid'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.9.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-nanolets:2.3.1'
    implementation 'com.github.ankidroid:Anki-Android:2.17alpha14'
    implementation 'org.jsoup:jsoup:1.14.3'
    implementation 'androidx.preference:preference:1.2.0'

    def room_version = "2.5.0"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
