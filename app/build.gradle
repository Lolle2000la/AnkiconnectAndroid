plugins {
    id 'com.android.application'
    id 'com.diffplug.spotless' version '6.25.0'
}

// Formatting is enforced only for files changed since the upstream baseline, so the
// existing codebase does not have to be reformatted all at once. Run `./gradlew spotlessApply`.
spotless {
    ratchetFrom 'origin/master'
    java {
        target 'src/**/*.java'
        palantirJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Release signing is configured through keystore.properties in the repository root.
// The file is intentionally gitignored; see keystore.properties.example and
// docs/self-hosting.md. Without it, `assembleRelease` produces an unsigned APK.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseSigning = keystorePropertiesFile.exists()

// Continuous integration overrides these with -PversionCode=... / -PversionName=...
def versionCodeOverride = project.findProperty("versionCode")
def versionNameOverride = project.findProperty("versionName")

android {
    compileSdk 37

    defaultConfig {
        // Distinct from the upstream com.kamwithk.ankiconnectandroid so this fork
        // can be installed side by side and updated independently.
        applicationId "com.lolle2000la.ankiconnectandroid"
        minSdk 26
        targetSdk 37
        versionCode (versionCodeOverride != null ? versionCodeOverride.toInteger() : 15)
        versionName (versionNameOverride != null ? versionNameOverride : "1.15")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace = 'com.kamwithk.ankiconnectandroid'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.nanohttpd:nanohttpd-nanolets:2.3.1'
    implementation 'com.github.ankidroid:Anki-Android:2.24.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'androidx.preference:preference:1.2.1'

    def room_version = "2.8.5"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
